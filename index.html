<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificador de Arquivos UAU</title>
    <style>
        body{
            font-family: sans-serif;
            font-size: 20px;
            color: yellow;
            background-color: rgb(37, 0, 37);
        }
        .seletor-de-arquivos{
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate( -50%, -50% );
                padding: 50px;
                border-radius: 10px;
                background-color: rgba(0, 0, 0, 0.8);
        }
        button{
            background-color: dodgerblue;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 10px;
        }
        button:hover{
            background-color: deepskyblue;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="seletor-de-arquivos">
        <h3> Selecione seu arquivo </h3>
        <input type="file" id="fileInput" name="Seu arquivo:" multiple hidden> 
        <br>
        <button id = "botaoEnviar">Enviar</button>
    </div>
<div id="resultados"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
